<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stuttering Empire</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body{
    height:100%;
    overflow:hidden;
  }

  .splash{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--grey);
  }

  .splash-content{
    position:relative;
    z-index:2;
    text-align:center;
    transition: opacity 0.6s ease;
  }

  .splash-content.splash-fading-ui{
    opacity:0;
  }

  .splash-title{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:44px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }

  .enter-btn{
    margin-top:46px;
    display:inline-block;
    background:transparent;
    border:1px solid var(--white);
    color:var(--white);
    font-family:'Cinzel', serif;
    font-size:14px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    padding:14px 42px;
    cursor:pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .enter-btn:hover{
    background:var(--white);
    color:var(--grey);
  }

  .enter-btn:focus-visible{
    outline:1px solid var(--white);
    outline-offset:4px;
  }

  #splash-canvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:block;
  }

  #splash-fade-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:var(--grey);
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
    z-index:10;
  }

  #splash-fade-overlay.active{
    opacity:1;
  }
</style>
</head>
<body>

  <div class="splash">
    <canvas id="splash-canvas"></canvas>
    <div class="splash-content" id="splash-content">
      <div class="splash-title">The Stuttering Empire</div>
      <br>
      <button class="enter-btn" id="enter-btn">Enter</button>
    </div>
  </div>

  <div id="splash-fade-overlay"></div>

  <script src="splash-map.js"></script>

</body>
</html>
